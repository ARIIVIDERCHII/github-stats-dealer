<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-group {
      opacity: 0;
      /* Указываем, что карта должна переворачиваться ровно по центру */
      transform-origin: center;
      transform-box: fill-box;
    }
    
    /* Назначаем разные анимации для левой, центральной и правой карт */
    .card-1 { animation: dealLeft 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.5s; }
    .card-2 { animation: dealCenter 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1s; }
    .card-3 { animation: dealRight 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.5s; }

    /* --- ТРАЕКТОРИЯ ЛЕВОЙ КАРТЫ --- */
    @keyframes dealLeft {
      0% { opacity: 0; transform: translate(330px, -200px) scale(0.5); } /* Вылет от дилера (центр-верх) */
      40% { opacity: 1; transform: translate(120px, 100px) scale(1); }   /* Ложится слева */
      50% { transform: translate(120px, 100px) scaleX(0); }              /* Переворот */
      60% { transform: translate(120px, 100px) scaleX(1); }
      100% { opacity: 1; transform: translate(120px, 100px) scaleX(1); }
    }

    /* --- ТРАЕКТОРИЯ ЦЕНТРАЛЬНОЙ КАРТЫ --- */
    @keyframes dealCenter {
      0% { opacity: 0; transform: translate(330px, -200px) scale(0.5); } /* Вылет от дилера */
      40% { opacity: 1; transform: translate(330px, 100px) scale(1); }   /* Ложится в центре */
      50% { transform: translate(330px, 100px) scaleX(0); }              /* Переворот */
      60% { transform: translate(330px, 100px) scaleX(1); }
      100% { opacity: 1; transform: translate(330px, 100px) scaleX(1); }
    }

    /* --- ТРАЕКТОРИЯ ПРАВОЙ КАРТЫ --- */
    @keyframes dealRight {
      0% { opacity: 0; transform: translate(330px, -200px) scale(0.5); } /* Вылет от дилера */
      40% { opacity: 1; transform: translate(540px, 100px) scale(1); }   /* Ложится справа */
      50% { transform: translate(540px, 100px) scaleX(0); }              /* Переворот */
      60% { transform: translate(540px, 100px) scaleX(1); }
      100% { opacity: 1; transform: translate(540px, 100px) scaleX(1); }
    }

    /* Анимация текста (появляется во время переворота) */
    .card-content { opacity: 0; }
    .content-1 { animation: showContent 2s forwards 0.5s; }
    .content-2 { animation: showContent 2s forwards 1s; }
    .content-3 { animation: showContent 2s forwards 1.5s; }

    @keyframes showContent {
      0%, 50% { opacity: 0; }
      60%, 100% { opacity: 1; }
    }
    
    /* Стилизация графики */
    .card-bg { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; rx: 10; }
    .card-text { font-family: Arial, sans-serif; font-size: 22px; fill: #212529; font-weight: bold; }
    .card-percent { font-family: Arial, sans-serif; font-size: 18px; fill: #6c757d; }
  </style>

  <!-- Левая карта -->
  <g class="card-group card-1">
    <rect class="card-bg" width="140" height="200" x="0" y="0" />
    <g class="card-content content-1">
      <text class="card-text" x="70" y="90" text-anchor="middle">{{ lang_1_name }}</text>
      <text class="card-percent" x="70" y="120" text-anchor="middle">{{ lang_1_percent }}%</text>
    </g>
  </g>

  <!-- Центральная карта -->
  <g class="card-group card-2">
    <rect class="card-bg" width="140" height="200" x="0" y="0" />
    <g class="card-content content-2">
      <text class="card-text" x="70" y="90" text-anchor="middle">{{ lang_2_name }}</text>
      <text class="card-percent" x="70" y="120" text-anchor="middle">{{ lang_2_percent }}%</text>
    </g>
  </g>

  <!-- Правая карта -->
  <g class="card-group card-3">
    <rect class="card-bg" width="140" height="200" x="0" y="0" />
    <g class="card-content content-3">
      <text class="card-text" x="70" y="90" text-anchor="middle">{{ lang_3_name }}</text>
      <text class="card-percent" x="70" y="120" text-anchor="middle">{{ lang_3_percent }}%</text>
    </g>
  </g>
</svg>
